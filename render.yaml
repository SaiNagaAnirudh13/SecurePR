services:
  - type: web
    name: securepr-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECUREPR_ENV
        value: production
      - key: SUPABASE_AUTH_AUDIENCE
        value: authenticated
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: GEMINI_MAX_ATTEMPTS
        value: "3"
      - key: REVIEW_RESULT_DEADLINE_SECONDS
        value: "180"
      - key: CI_API_MAX_RETRIES
        value: "5"
      - key: CI_FALLBACK_MAX_POLLS
        value: "10"
      - key: CI_FALLBACK_POLL_INTERVAL_SECONDS
        value: "30"
      - key: AUTO_MERGE_ENABLED
        value: "false"
      - key: AUTO_MERGE_LOW_RISK_ONLY
        value: "true"
      - key: AUTO_MERGE_METHOD
        value: SQUASH
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ALGORITHM
        sync: false
      - key: SECUREPR_OPERATOR_IDS
        sync: false
      - key: SECUREPR_ADMIN_IDS
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: DASHBOARD_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECUREPR_BASE_URL
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
